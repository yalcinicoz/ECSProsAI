# HTTP — Cloudflare "Flexible" SSL modunda origin'e HER ZAMAN düz HTTP ile bağlanılır
# (Cloudflare, visitor'a kendi sertifikasıyla https sunar, origin'e proxy olurken http kullanır).
# Burada https'e yönlendirme YAPILAMAZ — aksi halde Cloudflare ↔ origin arasında sonsuz
# yönlendirme döngüsü oluşur (visitor https ister → Cloudflare origin'e http gider →
# origin https'e yönlendirir → Cloudflare tekrar http ile dener → ...).
# misharitalia.com -> www.misharitalia.com
server {
    listen 80;
    server_name misharitalia.com;

    # PayTR bildirim (callback) POST'u www'SİZ adrese gelir (sözleşmedeki bildirim URL'i
    # https://misharitalia.com/CheckoutPayment/PayTrBildirim/). Server seviyesi 301 www'ye
    # yönlendirirse PayTR 301'i takip ETMEZ (POST gövdesi de düşer) → ödeme onayı gelmez.
    # Bu yüzden yalnız bu path doğrudan uygulamaya proxy'lenir; diğer her şey www'ye 301 olur.
    location ~* ^/checkoutpayment/paytrbildirim/?$ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Faz 1: /health yönlendirmeden muaf — LB/izleme probu hangi Host ile gelirse gelsin cevap alır.
    location = /health {
        proxy_pass http://host.docker.internal:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://www.misharitalia.com$request_uri;
    }
}

server {
    listen 80;
    server_name new.ecspros.com www.misharitalia.com;
    include /etc/nginx/conf.d/locations.inc;
}

# HTTPS — doğrudan IP/sunucu adı ile erişim için (self-signed sertifika).
# Cloudflare Flexible modu bu bloğu hiç kullanmaz (origin'e sadece 80 üzerinden bağlanır).
server {
    listen 443 ssl;
    http2 on;
    server_name misharitalia.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # PayTR bildirim callback'i www'siz adrese gelirse (Cloudflare Full modunda origin'e 443
    # ile bağlanabilir) 301'e takılmasın — port 80 bloğuyla aynı istisna.
    location ~* ^/checkoutpayment/paytrbildirim/?$ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Faz 1: /health yönlendirmeden muaf — LB/izleme probu hangi Host ile gelirse gelsin cevap alır.
    location = /health {
        proxy_pass http://host.docker.internal:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://www.misharitalia.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name new.ecspros.com www.misharitalia.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/locations.inc;
}
