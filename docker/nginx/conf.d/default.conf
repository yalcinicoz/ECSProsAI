# HTTP — Cloudflare "Flexible" SSL modunda origin'e HER ZAMAN düz HTTP ile bağlanılır
# (Cloudflare, visitor'a kendi sertifikasıyla https sunar, origin'e proxy olurken http kullanır).
# Burada https'e yönlendirme YAPILAMAZ — aksi halde Cloudflare ↔ origin arasında sonsuz
# yönlendirme döngüsü oluşur (visitor https ister → Cloudflare origin'e http gider →
# origin https'e yönlendirir → Cloudflare tekrar http ile dener → ...).
server {
    listen 80;
    server_name new.ecspros.com;
    include /etc/nginx/conf.d/locations.inc;
}

# Eski SPA yedeği (rol değişimi, 2026-07-07): Razor storefront artık locations.inc'teki
# / bloğuyla domain'de yayında (plan B14). Eski SPA karşılaştırma/geri dönüş için burada
# duruyor; SPA emekli olunca (Faz İ) bu blok ve compose'daki 8080 port eşlemesi kaldırılacak.
server {
    listen 8080;
    server_name _;

    client_max_body_size 50m;

    # API — SPA'nın çalışması için backend erişimi
    location /api/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /media/ {
        alias /usr/share/nginx/html/media/;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html/store;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }
        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

# HTTPS — doğrudan IP/sunucu adı ile erişim için (self-signed sertifika).
# Cloudflare Flexible modu bu bloğu hiç kullanmaz (origin'e sadece 80 üzerinden bağlanır).
server {
    listen 443 ssl;
    server_name new.ecspros.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/locations.inc;
}
