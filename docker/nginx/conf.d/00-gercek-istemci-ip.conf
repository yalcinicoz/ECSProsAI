# FAZ 11 / K1 eşlik düzeltmesi (2026-08-30): uygulama artık istemci IP'sini YALNIZ
# ForwardedHeaders sonrası RemoteIpAddress'ten okur (ham CF-Connecting-IP okunmaz).
# Cloudflare arkasında $proxy_add_x_forwarded_for zinciri "istemci, CF-edge" olur ve
# ForwardLimit=1 ile uygulamaya CF edge IP'si kalırdı (yanlış GeoIP + ortak rate-limit
# kovası). Bu map, X-Forwarded-For'u TEK ve GERÇEK istemci IP'siyle üretir:
#   CF'den gelen istekte CF-Connecting-IP; CF'siz doğrudan istekte soket adresi.
map $http_cf_connecting_ip $gercek_istemci_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}
