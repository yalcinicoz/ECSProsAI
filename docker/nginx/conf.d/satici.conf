# Satıcı paneli (2026-08-11) — satici.misharitalia.com subdomain'i.
# Panel kökten servis edilir (vite base '/'); /api ana siteyle aynı upstream'e proxy'lenir.
# DNS A kaydı ve (istenirse) subdomain'i kapsayan sertifika kullanıcı tarafında.

server {
    listen 80;
    server_name satici.misharitalia.com;
    return 301 https://satici.misharitalia.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name satici.misharitalia.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # API — ana site ile aynı upstream + oran sınırları
    location /api/supplier/auth/ {
        limit_req zone=ecs_auth burst=20 nodelay;
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=ecs_api burst=100 nodelay;
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA — kökten
    location / {
        root /usr/share/nginx/html/satici;
        index index.html;
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
        location ~* \.(js|css|svg|png|ico|woff2?)$ {
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
        }
    }
}
