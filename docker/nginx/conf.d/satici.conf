# Satıcı paneli (2026-08-11) — partner.misharitalia.com subdomain'i.
# DİKKAT: Cloudflare "Flexible" SSL — origin'e HER ZAMAN düz HTTP (80) gelir; burada
# https'e yönlendirme YAPILAMAZ (default.conf'taki döngü notuyla aynı kural).
# 443 bloğu yalnız doğrudan IP/Full mod erişimi içindir.

server {
    listen 80;
    server_name partner.misharitalia.com;
    include /etc/nginx/conf.d/satici-locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name partner.misharitalia.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    include /etc/nginx/conf.d/satici-locations.inc;
}
