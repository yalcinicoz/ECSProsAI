# Hız sınırlama bölgeleri (2026-07-23) — anonim API uçlarına brute-force/hacim freni.
# Dosya adı 00- ile başlar: conf.d/*.conf alfabetik yüklenir, zone'lar default.conf'tan
# önce tanımlanmış olur.
#
# Cloudflare arkasında $remote_addr CF edge IP'sidir — doğrudan onunla sınırlama yapılsa
# tüm ziyaretçiler tek anahtarda birleşir ve site kendini kilitler. Gerçek istemci IP'si
# CF-Connecting-IP başlığından alınır; başlık yoksa (doğrudan erişim) $remote_addr kullanılır.
map $http_cf_connecting_ip $ecs_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

# Kimlik uçları (login/register/otp/refresh): IP başına dakikada 60 istek.
limit_req_zone $ecs_client_ip zone=ecs_auth:10m rate=60r/m;
# Genel API: IP başına saniyede 30 istek (CGNAT/ofis NAT arkasındaki çoklu kullanıcıya pay bırakır).
limit_req_zone $ecs_client_ip zone=ecs_api:10m rate=30r/s;

limit_req_status 429;
