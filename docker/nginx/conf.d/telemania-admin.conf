# Telemania demo — admin panel (admin-telemania.ecspros.com)
# Ayrı host: aynı admin SPA, yalnız /api ve /hubs demo backend'e (:5050) gider.
# Cloudflare Flexible: origin'e 80 üzerinden gelir; 443 bloğu doğrudan erişim içindir.

server {
    listen 80;
    server_name admin-telemania.ecspros.com;
    include /etc/nginx/conf.d/telemania-admin-locations.inc;
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin-telemania.ecspros.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/conf.d/telemania-admin-locations.inc;
}
