# vsftpd yapılandırması — ECSPros Media FTP

# Temel ayarlar
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=YES

# Chroot — kullanıcı kendi dizininden çıkamaz
chroot_local_user=YES
allow_writeable_chroot=YES

# Pasif mod — port aralığı firewall'da da açılmalı
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
# Sunucunun dış IP'si — passive bağlantılarda doğru IP dönmesi için
pasv_address=51.178.208.59

# Güvenlik
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# Log
xferlog_file=/var/log/vsftpd.log
log_ftp_protocol=NO

# Bant genişliği limiti (0 = sınırsız)
local_max_rate=0

# ASCII mod (resim/video için binary yeterli)
ascii_upload_enable=NO
ascii_download_enable=NO
