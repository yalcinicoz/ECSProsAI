# ECSPros iki API düğümü için geçici kabul testi virtual host'u.
# Hedef sunucu: nginxlb (192.168.0.56), domain: multi-test.misharitalia.com

map $http_cf_connecting_ip $ecspros_test_client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

map $http_upgrade $ecspros_test_connection {
    default upgrade;
    ""      "";
}

upstream ecspros_multi_test_api {
    zone ecspros_multi_test_api 64k;
    hash $ecspros_test_client_ip consistent;
    keepalive 64;

    server 192.168.0.245:5050 max_fails=3 fail_timeout=10s;
    server 192.168.0.58:5050  max_fails=3 fail_timeout=10s;
}

server {
    listen 80;
    listen [::]:80;
    server_name multi-test.misharitalia.com;

    client_max_body_size 50m;
    access_log /var/log/nginx/ecspros-multi-test.access.log;
    error_log /var/log/nginx/ecspros-multi-test.error.log warn;

    add_header X-Robots-Tag "noindex, nofollow" always;

    # React/Vite admin SPA (base=/admin). API istekleri aşağıdaki genel proxy
    # üzerinden aynı origin'deki iki API düğümüne gider.
    location /admin/ {
        alias /usr/share/nginx/html/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            expires 0;
        }

        location ~* \.(js|css)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /health {
        proxy_pass http://ecspros_multi_test_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ecspros_test_client_ip;
        proxy_set_header X-Forwarded-For $ecspros_test_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location /hubs/ {
        proxy_pass http://ecspros_multi_test_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ecspros_test_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ecspros_test_client_ip;
        proxy_set_header X-Forwarded-For $ecspros_test_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://ecspros_multi_test_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ecspros_test_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $ecspros_test_client_ip;
        proxy_set_header X-Forwarded-For $ecspros_test_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_cache_bypass $http_upgrade;
    }
}
