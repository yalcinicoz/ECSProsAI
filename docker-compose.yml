services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    # D5 yük testi bulgusu (2026-08-27): varsayılan /dev/shm 64MB, 40+ eşzamanlı istekte paralel
    # sorgu işçileri doldurup 53100 hatası veriyordu — uygulanması için: sudo docker compose up -d postgres
    shm_size: 1g
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ecommerce_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      # Yalnız host'taki API/araçlar erişir — 0.0.0.0'a açmak DB'yi internete açıyordu
      # (docs/SiteYavaslikDegerlendirme.txt bulgusu; sunucu IP'si public)
      - "127.0.0.1:5432:5432"
      - "192.168.0.59:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    ports:
      # Yalnız host'taki API erişir (localhost:6379) — bkz. postgres port notu
      - "127.0.0.1:6379:6379"
      - "192.168.0.59:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs/nginx:/var/log/nginx
      - ./admin/dist:/usr/share/nginx/html/admin:ro
      - ./satici/dist:/usr/share/nginx/html/satici:ro
      - ./media:/usr/share/nginx/html/media:ro
      - ./docker/nginx/html/rehber:/usr/share/nginx/html/rehber:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - postgres
      - redis

networks:
  default:
    name: ecommerce-network
